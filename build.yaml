---
# 화면 셰이드: nice_view_mod = 기본 화면 + 배터리 % + 오른쪽 vim 로고(boards/shields/nice_view_mod), nice_view = ZMK 기본 화면, nice_epaper = 커스텀 화면(boards/shields/nice_oled, 좌우 .conf 주석 함께 해제)
include:
  - board: nice_nano_v2
    shield: eyelash_corne_right nice_view_mod
  - board: nice_nano_v2
    shield: eyelash_corne_left nice_view_mod
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_corne_studio_left
  - board: nice_nano_v2
    shield: settings_reset