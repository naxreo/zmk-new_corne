#EXT POWER
CONFIG_ZMK_EXT_POWER=y

#EC11 enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# === Basic ===
CONFIG_INPUT=y

# === Battery (Peripheral) ===
CONFIG_ZMK_BATTERY_HISTORY=n
CONFIG_ZMK_BATTERY_HISTORY_INTERVAL_MINUTES=30
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# === Display: zmk-nice-oled (Peripheral = crystal animation) ===
# 현재는 ZMK 기본 nice!view 화면을 쓴다. 커스텀 화면으로 되돌리려면
# build.yaml·build.sh 의 셰이드를 nice_view → nice_epaper 로 바꾸고 아래 주석을 푼다
#CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
#CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
#CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=y
